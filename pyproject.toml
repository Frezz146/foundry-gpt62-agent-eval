[project]
name = "gpt62eval"
version = "0.1.0"
description = "Small agent decision test of GPT-6.2 Astra and Sol against their predecessors in Microsoft Foundry"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.26.0",
    "agent-framework-openai>=1.18.2",
    "azure-identity>=1.27.0",
    "mcp>=2.2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt62eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
